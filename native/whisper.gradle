// Ditambahkan ke android/app/build.gradle lewat: apply from: "whisper.gradle"
android {
    ndkVersion "26.1.10909125"
    defaultConfig {
        ndk { abiFilters "arm64-v8a" }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                // Release walau varian debug: whisper.cpp tanpa optimasi sangat lambat.
                arguments "-DCMAKE_BUILD_TYPE=Release", "-DANDROID_STL=c++_static"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}
