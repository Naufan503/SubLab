name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      whisper_tag:
        description: "Tag whisper.cpp (https://github.com/ggml-org/whisper.cpp/tags)"
        required: false
        default: "v1.7.6"

env:
  WHISPER_TAG: ${{ github.event.inputs.whisper_tag || 'v1.7.6' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang NDK dan CMake (SDK bawaan runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls "$ANDROID_HOME/cmdline-tools" || true
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Pasang dependensi npm
        run: npm install --no-audit --no-fund

      - name: Buat proyek Android (Capacitor)
        run: |
          npx cap add android
          npx cap sync android

      - name: Buat ikon aplikasi dari folder assets/
        run: npx capacitor-assets generate --android --assetPath assets

      - name: Ambil whisper.cpp ${{ env.WHISPER_TAG }}
        run: git clone --depth 1 --branch "$WHISPER_TAG" https://github.com/ggml-org/whisper.cpp native/cpp/whisper.cpp

      - name: Tempel plugin native
        run: node scripts/apply-native.mjs

      - name: Build APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Siapkan keystore (opsional)
        id: ks
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK release bertanda tangan (opsional)
        if: steps.ks.outputs.have == 'true'
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="${KEY_PASS:-$KS_PASS}"

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: SubLab-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
